name: Build Debian package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debian ${{ matrix.suite }} (TDE R14.1.x)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ bookworm, trixie ]
    env:
      SUITE: ${{ matrix.suite }}
      IMAGE: tdeflatpak-build:${{ matrix.suite }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build package (Docker, Debian ${{ matrix.suite }})
        run: scripts/build-deb.sh

      - name: Unit tests
        run: |
          docker run --rm -v "$PWD":/src:ro "$IMAGE" bash -euc '
            cmake -S /src -B /tmp/b -DCMAKE_INSTALL_PREFIX=/opt/trinity -DBUILD_TESTS=ON >/dev/null
            cmake --build /tmp/b --target tdeflatpak-unittests -j"$(nproc)" >/dev/null
            HOME=/tmp/h /tmp/b/tests/tdeflatpak-unittests'

      - name: GUI transaction test (install/uninstall via .flatpakref)
        run: |
          mkdir -p screenshots
          docker run --rm -v "$PWD":/src:ro -v "$PWD/screenshots":/shots "$IMAGE" \
            bash /src/tests/transaction-test.sh /shots

      - name: GUI features test (details, browse, permissions, Control Center module)
        run: |
          docker run --rm -v "$PWD":/src:ro -v "$PWD/screenshots":/shots "$IMAGE" \
            bash /src/tests/features-test.sh /shots

      - name: GUI smoke test
        run: |
          docker run --rm -v "$PWD":/src:ro -v "$PWD/screenshots":/shots "$IMAGE" \
            bash /src/tests/smoke-test.sh /shots

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: tdeflatpak-debian-${{ matrix.suite }}-amd64
          path: |
            dist/*.deb
            dist/*.buildinfo
            dist/*.changes
          if-no-files-found: error

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots-${{ matrix.suite }}
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tdeflatpak-debian-*-amd64
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
